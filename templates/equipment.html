{% extends "base.html" %}
{% block title %}Equipment{% endblock %}
{% block content %}
<h1>Equipment</h1>
<p class="subtitle">Pumps, valves, pipes and other equipment that gets inspected and repaired</p>

<div class="card">
    <form id="search-form" class="toolbar">
        <div class="field">
            <label for="q">Search</label>
            <input type="text" id="q" name="q" placeholder="Name, tag or type">
        </div>
        <button type="submit">Search</button>
        <span style="flex: 1"></span>
        <button type="button" id="new-button" class="hidden">+ New equipment</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Tag</th><th>Name</th><th>Type</th><th>Location</th>
                    <th>Manufacturer</th><th>Installed</th><th>Inspect every</th><th></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>

<div class="card hidden" id="form-card">
    <h2 id="form-title">New equipment</h2>
    <form id="equipment-form" novalidate>
        <input type="hidden" name="equipment_id">
        <div class="form-grid">
            <div class="field">
                <label for="tag_number">Tag number *</label>
                <input type="text" id="tag_number" name="tag_number" maxlength="20" placeholder="e.g. P1-PHT-P04">
            </div>
            <div class="field">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" maxlength="50">
            </div>
            <div class="field">
                <label for="equipment_type">Type *</label>
                <input type="text" id="equipment_type" name="equipment_type" maxlength="20" list="type-suggestions">
                <datalist id="type-suggestions">
                    <option value="Pump"><option value="Valve"><option value="Pipe"><option value="Motor">
                    <option value="Sensor"><option value="Heat Exchanger">
                </datalist>
            </div>
            <div class="field" style="grid-column: span 2">
                <label for="system_id">Plant system *</label>
                <select id="system_id" name="system_id"></select>
            </div>
            <div class="field">
                <label for="manufacturer">Manufacturer</label>
                <input type="text" id="manufacturer" name="manufacturer" maxlength="50">
            </div>
            <div class="field">
                <label for="install_date">Install date *</label>
                <input type="date" id="install_date" name="install_date">
            </div>
            <div class="field">
                <label for="inspection_interval_days">Inspection interval (days) *</label>
                <input type="number" id="inspection_interval_days" name="inspection_interval_days" min="1">
            </div>
        </div>
        <div class="toolbar" style="margin-top: 16px">
            <button type="submit">Save</button>
            <button type="button" class="secondary" id="cancel-button">Cancel</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/equipment.js') }}"></script>
{% endblock %}
